name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Fetch Mathlib cache
        run: lake exe cache get
      - name: Build Lean project
        run: lake build
      - name: Python regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Run reference sweep
        run: python3 scripts/reference_check.py
      - name: Report explicit sorry count
        run: |
          count=$(grep -R --fixed-string -h 'sorry' PascalMinusOne/*.lean | wc -l)
          echo "Explicit sorry count: $count"
          test "$count" -eq 0
